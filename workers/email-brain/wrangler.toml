# The email brain's alarm clock (see index.ts). Separate deployable from the
# Pages project: deploy with `npx wrangler deploy` from this directory.
# One secret: CRON_SECRET (set via `npx wrangler secret put CRON_SECRET`),
# value identical to the Pages secret of the same name.

name = "email-brain"
main = "index.ts"
compatibility_date = "2026-05-01"

[triggers]
crons = ["0 * * * *"]
