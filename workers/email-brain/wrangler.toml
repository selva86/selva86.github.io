# The ops alarm clock (see index.ts). Separate deployable from the Pages
# project: deploy with `npx wrangler deploy` from this directory.
# One secret: CRON_SECRET (set via `npx wrangler secret put CRON_SECRET`),
# value identical to the Pages secret of the same name.
#
# Every cron below must have a matching key in the ROUTES map in index.ts,
# spelled identically. A cron with no route fires and runs nothing.

name = "email-brain"
main = "index.ts"
compatibility_date = "2026-05-01"

[triggers]
crons = [
  "0 * * * *",   # hourly: the email brain
  "40 2 * * *",  # daily 02:40 UTC: the pricing integrity check, 20 min before the 03:00 digest
]
