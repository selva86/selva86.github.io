<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in &middot; r-statistics.co</title>
  <meta name="description" content="Sign in to your r-statistics.co account.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://r-statistics.co/signin.html">
  <link rel="shortcut icon" href="/screenshots/iconb-64.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f8f9fb; --surface:#fff; --ink:#0a0d14; --ink-2:#1f2533;
      --mute:#4b5260; --faint:#6b7280; --line:#e4e7ee; --border:#d4d9e3;
      --navy:#1c2c4f; --navy-2:#2d4173; --acc:#2056d2; --acc-h:#1842a8;
      --acc-soft:#e9efff; --success:#137a3e; --success-soft:#dff1e3;
      --danger:#9a1f1f; --danger-soft:#fbe2e2;
      --r:10px; --r-sm:6px; --r-md:13px;
      --sh:0 4px 12px -4px rgba(10,13,20,.08),0 2px 4px -2px rgba(10,13,20,.05);
      --sh-md:0 10px 30px -10px rgba(10,13,20,.18),0 4px 10px -4px rgba(10,13,20,.08);
      --ease:cubic-bezier(.22,.61,.36,1);
    }
    body{
      font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
      color:var(--ink);background:var(--bg);min-height:100vh;
      display:flex;align-items:center;justify-content:center;padding:20px;
      font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
    }
    .card{
      background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
      box-shadow:var(--sh-md);width:100%;max-width:420px;padding:36px 32px;
    }
    .brand{display:flex;align-items:center;gap:9px;margin-bottom:24px;
      font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;color:var(--ink);
      text-decoration:none;}
    .brand .mark{
      width:30px;height:30px;border-radius:7px;
      background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;
      display:flex;align-items:center;justify-content:center;
      font-family:'IBM Plex Serif',Georgia,serif;font-style:italic;font-weight:700;
      font-size:17px;letter-spacing:-.04em;
    }
    .brand .co{color:var(--faint)}
    h1{font-family:'IBM Plex Serif',Georgia,serif;font-weight:600;font-size:24px;
      letter-spacing:-.018em;margin-bottom:4px;color:var(--ink)}
    .lead{color:var(--mute);font-size:14px;margin-bottom:24px}
    .oauth-row{display:flex;flex-direction:column;gap:9px;margin-bottom:20px}
    .btn-oauth{
      display:flex;align-items:center;justify-content:center;gap:10px;
      padding:11px 16px;border:1px solid var(--border);border-radius:var(--r-sm);
      background:#fff;color:var(--ink);font-family:inherit;font-size:14px;
      font-weight:500;cursor:pointer;transition:border-color .15s var(--ease),
      background .15s var(--ease);
    }
    .btn-oauth:hover:not(:disabled){border-color:var(--ink-2);background:#fafbff}
    .btn-oauth:disabled{opacity:.55;cursor:wait}
    .btn-oauth svg{width:18px;height:18px;flex:none}
    .divider{display:flex;align-items:center;gap:12px;color:var(--faint);
      font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:18px 0}
    .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
    label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--ink-2)}
    input[type=email]{
      width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--r-sm);
      font-family:inherit;font-size:14.5px;color:var(--ink);background:#fff;
      transition:border-color .15s,box-shadow .15s;
    }
    input[type=email]:focus{
      outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft);
    }
    .btn-primary{
      width:100%;padding:12px 18px;border:none;border-radius:var(--r-sm);
      background:var(--acc);color:#fff;font-family:inherit;font-size:14.5px;
      font-weight:600;cursor:pointer;margin-top:12px;
      transition:background .15s var(--ease);
    }
    .btn-primary:hover:not(:disabled){background:var(--acc-h)}
    .btn-primary:disabled{opacity:.55;cursor:wait;background:var(--acc)}
    .msg{
      font-size:13px;padding:10px 12px;border-radius:var(--r-sm);
      margin-top:14px;line-height:1.5;
    }
    .msg.success{background:var(--success-soft);color:var(--success);border:1px solid #b8e0c5}
    .msg.error{background:var(--danger-soft);color:var(--danger);border:1px solid #f0b4b4}
    .msg.info{background:var(--acc-soft);color:var(--acc-h);border:1px solid #b8c8e8}
    .foot{margin-top:22px;text-align:center;font-size:12.5px;color:var(--faint);line-height:1.55}
    .foot a{color:var(--acc)}
    .hidden{display:none!important}
    .spinner{
      display:inline-block;width:13px;height:13px;border:2px solid currentColor;
      border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;
      vertical-align:-2px;margin-right:6px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .booting{text-align:center;color:var(--faint);padding:20px 0;font-size:13.5px}
    /* Newsletter opt-in — sits between the email field and the submit button.
       Unticked by default (GDPR), separate from the Terms line in the footer. */
    .newsletter-optin{display:flex;align-items:flex-start;gap:8px;margin-top:12px;
      font-size:13px;color:var(--mute);cursor:pointer;font-weight:400}
    .newsletter-optin input{flex:0 0 auto;width:16px;height:16px;margin-top:1px;
      accent-color:var(--acc);cursor:pointer}
  </style>
</head>
<body>

<div class="card" role="main">
  <a class="brand" href="/"><span class="mark">R</span>r-statistics<span class="co">.co</span></a>

  <h1>Sign in</h1>
  <p class="lead">Magic link, Google, or GitHub. No password needed.</p>

  <div class="booting" id="booting"><span class="spinner"></span>Loading...</div>

  <div id="ui" class="hidden">
    <div class="oauth-row">
      <button class="btn-oauth" data-provider="google" type="button">
        <svg viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.81 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.97 10.72A5.41 5.41 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58A9 9 0 0 0 9 0 9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        <span>Continue with Google</span>
      </button>
      <button class="btn-oauth" data-provider="github" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="#181717">
          <path d="M12 .3a12 12 0 0 0-3.8 23.38c.6.1.83-.26.83-.58v-2c-3.34.72-4.04-1.6-4.04-1.6-.55-1.4-1.34-1.77-1.34-1.77-1.08-.74.09-.72.09-.72 1.2.08 1.83 1.24 1.83 1.24 1.08 1.83 2.81 1.3 3.5 1 .1-.78.42-1.3.76-1.6-2.66-.3-5.47-1.34-5.47-5.95 0-1.32.47-2.4 1.24-3.24-.13-.3-.54-1.52.1-3.17 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.66 1.65.24 2.87.12 3.17a4.7 4.7 0 0 1 1.24 3.24c0 4.62-2.82 5.64-5.5 5.94.43.37.81 1.1.81 2.22v3.3c0 .32.21.7.83.58A12 12 0 0 0 12 .3"/>
        </svg>
        <span>Continue with GitHub</span>
      </button>
    </div>

    <div class="divider">or with email</div>

    <form id="magic-form">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="email" required
             placeholder="you@example.com">
      <label class="newsletter-optin">
        <input type="checkbox" id="newsletter-optin">
        <span>Send me R tips &amp; updates</span>
      </label>
      <button class="btn-primary" id="btn-magic" type="submit">
        <span>Send magic link</span>
      </button>
    </form>

    <div class="msg hidden" id="msg" role="alert"></div>
  </div>

  <p class="foot">
    By signing in you agree to our <a href="/terms-of-service.html">Terms</a>
    and <a href="/privacy.html">Privacy Policy</a>.
    <br><br>
    <a href="/">Back to r-statistics.co</a>
  </p>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';

// Honor ?next=<path> for redirect-after-signin. Defaults to /account.html.
// `next` MUST be a same-origin path (starts with /) to prevent open-redirect.
function resolveRedirectAfterAuth() {
  const params = new URLSearchParams(window.location.search);
  const next = params.get('next');
  if (next && next.startsWith('/') && !next.startsWith('//')) {
    return window.location.origin + next;
  }
  return window.location.origin + '/account.html';
}
const REDIRECT_AFTER_AUTH = resolveRedirectAfterAuth();

// The OAuth / magic-link round-trip MUST land on a page that can parse the
// access_token from the URL hash and persist it to localStorage — that's
// signin.html itself (and /account.html). Tutorial pages and most other
// pages only have auth-hydrate.js, which reads from localStorage but does
// NOT process the URL hash. So we always send Google / email back to
// signin.html, carrying the eventual destination as ?next=. After
// detectSessionInUrl stores the session, getSession() succeeds at the top
// of the init flow and we redirect on to REDIRECT_AFTER_AUTH.
function buildOauthCallback() {
  const params = new URLSearchParams(window.location.search);
  const next = params.get('next');
  const u = new URL('/signin.html', window.location.origin);
  if (next && next.startsWith('/') && !next.startsWith('//')) {
    u.searchParams.set('next', next);
  }
  return u.toString();
}
const OAUTH_CALLBACK_URL = buildOauthCallback();

function showMsg(kind, text) {
  const m = document.getElementById('msg');
  m.className = 'msg ' + kind;
  m.textContent = text;
  m.classList.remove('hidden');
}

(async function init() {
  // Fetch the public Supabase config from our edge endpoint so we don't
  // hardcode the URL/anon-key in HTML (avoids manual-paste drift).
  let cfg;
  try {
    const resp = await fetch('/api/_auth-config');
    if (!resp.ok) throw new Error('config endpoint returned ' + resp.status);
    cfg = await resp.json();
  } catch (e) {
    document.getElementById('booting').innerHTML =
      '<div class="msg error">Could not load auth config: ' + (e.message || 'unknown error') + '</div>';
    return;
  }

  const supa = createClient(cfg.url, cfg.anonKey, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      // Implicit flow: tokens land in the URL hash after redirect, no
      // PKCE verifier required. Trade-off vs PKCE: magic links work
      // across browsers/devices (user can click email link on a
      // different device than where they requested it). For HTTPS-only
      // sites with short-lived JWTs this is acceptable.
      flowType: 'implicit',
    },
  });

  // Already signed in? Skip the form.
  const { data: { session } } = await supa.auth.getSession();
  if (session) {
    window.location.replace(REDIRECT_AFTER_AUTH);
    return;
  }

  // Reveal the UI.
  document.getElementById('booting').classList.add('hidden');
  document.getElementById('ui').classList.remove('hidden');

  // Surface session-revocation outcomes from /account.
  const params = new URLSearchParams(window.location.search);
  const revoked = params.get('revoked');
  if (revoked === 'self') {
    showMsg('info', 'Signed out of this device. Sign in again to continue.');
  } else if (revoked === 'all') {
    showMsg('info', 'Signed out of every device. Sign in to start a fresh session.');
  }

  // Newsletter opt-in (unticked by default). Captured here as an audit signal;
  // the actual Zoho Campaigns sync is Phase 6. Mirrors www/signin-nudge.js so
  // the key/shape is identical regardless of where the user opted in. Applies to
  // every method: email passes it as user metadata; OAuth stores it locally for
  // Phase 6 to apply post-auth (signInWithOAuth can't carry user metadata).
  function wantsNewsletter() {
    const c = document.getElementById('newsletter-optin');
    return !!(c && c.checked);
  }
  function recordOptinSignal() {
    try {
      localStorage.setItem('rs-marketing-optin', JSON.stringify({
        opted_in: true, source: 'signin-page', at: new Date().toISOString(),
      }));
    } catch (_) {}
  }

  // OAuth buttons.
  document.querySelectorAll('[data-provider]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const provider = btn.dataset.provider;
      const labelSpan = btn.querySelector('span');
      const origLabel = labelSpan.textContent;
      if (wantsNewsletter()) recordOptinSignal();
      btn.disabled = true;
      labelSpan.innerHTML = '<span class="spinner"></span>Redirecting...';
      const { error } = await supa.auth.signInWithOAuth({
        provider,
        options: { redirectTo: OAUTH_CALLBACK_URL },
      });
      if (error) {
        showMsg('error', error.message || 'Could not start OAuth flow.');
        btn.disabled = false;
        labelSpan.textContent = origLabel;
      }
    });
  });

  // Magic link form.
  document.getElementById('magic-form').addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const btn = document.getElementById('btn-magic');
    const labelSpan = btn.querySelector('span');
    if (!email) return;
    btn.disabled = true;
    labelSpan.innerHTML = '<span class="spinner"></span>Sending...';
    const otpOptions = { emailRedirectTo: OAUTH_CALLBACK_URL };
    if (wantsNewsletter()) {
      recordOptinSignal();
      otpOptions.data = {
        marketing_opt_in: true,
        marketing_opt_in_source: 'signin-page',
        marketing_opt_in_at: new Date().toISOString(),
      };
    }
    const { error } = await supa.auth.signInWithOtp({
      email,
      options: otpOptions,
    });
    btn.disabled = false;
    labelSpan.textContent = 'Send magic link';
    if (error) {
      showMsg('error', error.message || 'Could not send link. Try again.');
    } else {
      showMsg('success', 'Check your inbox. Link is good for 60 minutes; you can close this tab.');
      document.getElementById('email').value = '';
    }
  });
})();
</script>
