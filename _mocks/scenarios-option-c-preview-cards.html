<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Worked examples - Option C (preview cards) - mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,500;0,600;0,700;1,500;1,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --c-text:#0d1117;--c-text-soft:#4a5160;--c-text-mute:#757a87;
    --c-bg:#fafbfc;--c-bg-alt:#f1f3f6;--c-border:#d8dce2;--c-border-soft:#e8eaef;
    --c-surface:#ffffff;--c-rule:#d8dce2;
    --c-link:#1d3158;--c-accent:#1d3158;--c-accent-soft:rgba(29,49,88,0.07);--c-accent-deep:#0f1c3a;
    --c-accent-line:rgba(29,49,88,0.20);
    --c-success:#1f6f48;--c-success-soft:rgba(31,111,72,0.10);
    --c-warn:#8b6500;--c-warn-soft:rgba(139,101,0,0.10);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--c-bg);color:var(--c-text);font-family:'IBM Plex Sans',sans-serif;font-size:16px;line-height:1.65}
  .container{max-width:980px;margin:0 auto;padding:32px 24px 72px}
  .mock-tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--c-text-mute);background:#fff7e0;border:1px solid #f0d97a;padding:4px 10px;border-radius:4px;margin-bottom:14px}
  h1{font-family:'IBM Plex Serif',serif;font-weight:700;font-size:2.2em;line-height:1.15;margin:0 0 8px;letter-spacing:-0.012em}
  .primer{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--c-rule);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--c-text-soft);margin:0 0 18px}
  .primer .pl-icon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:1.2px solid var(--c-accent);border-radius:50%;font-size:10px;font-weight:700;color:var(--c-accent);font-family:'IBM Plex Serif',serif;font-style:italic}
  .banner-sentence{font-family:'IBM Plex Serif',serif;font-size:21px;line-height:1.55;color:var(--c-text-soft);font-weight:400;letter-spacing:-0.005em;max-width:80ch;margin:0 0 14px}
  .pill{display:inline-block;font-family:'IBM Plex Sans',sans-serif;font-size:0.78em;font-weight:600;background:var(--c-accent-soft);color:var(--c-accent);padding:3px 11px 4px;border-radius:99px;border:1.5px solid transparent}
  .shell{background:var(--c-surface);border:1px solid var(--c-border);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(13,17,23,0.025);margin:18px 0 0}
  .shell > .section{padding:22px 28px;border-bottom:1px solid var(--c-border-soft)}
  .shell > .section:last-child{border-bottom:none}

  /* OPTION C: preview cards with mini-result */
  .scenarios-section{padding:20px 28px}
  .scenarios-label{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--c-text-mute);margin-bottom:12px}
  .scenarios-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .scenario-card{display:flex;flex-direction:column;justify-content:space-between;background:var(--c-surface);border:1px solid var(--c-rule);border-radius:10px;padding:12px 14px;cursor:pointer;font-family:inherit;text-align:left;min-height:84px;transition:all 0.18s ease}
  .scenario-card:hover{border-color:var(--c-accent-line);transform:translateY(-1px);box-shadow:0 4px 14px rgba(13,17,23,0.07),0 1px 2px rgba(13,17,23,0.04)}
  .scenario-card.active{border-color:var(--c-accent);box-shadow:0 0 0 3px var(--c-accent-soft)}
  .sc-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .sc-icon{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;background:var(--c-accent-soft);color:var(--c-accent);flex-shrink:0}
  .scenario-card.active .sc-icon{background:var(--c-accent);color:#fff}
  .sc-name{font-family:'IBM Plex Serif',serif;font-style:italic;font-size:14.5px;font-weight:500;color:var(--c-text);line-height:1.25}
  .sc-result{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--c-text-soft);line-height:1.5;border-top:1px dashed var(--c-rule);padding-top:8px}
  .sc-result .mute{color:var(--c-text-mute)}
  .sc-result .pos{color:var(--c-success);font-weight:600}
  .sc-result .neu{color:var(--c-warn);font-weight:600}
  .sc-result b{color:var(--c-text);font-weight:600}
  .sc-arrow{color:var(--c-text-mute);margin-right:3px}

  /* faked workshop */
  .workshop-fake{display:grid;grid-template-columns:240px 320px 1fr;gap:0;background:var(--c-bg)}
  .col-fake{padding:22px 22px 24px;background:var(--c-surface);min-height:160px;border-right:1px solid var(--c-border-soft)}
  .col-fake:last-child{border-right:none;background:var(--c-surface)}
  .col-fake .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--c-text-mute);padding:0 0 12px;margin:0 0 16px;border-bottom:1px solid var(--c-rule);display:flex;align-items:baseline;gap:10px}
  .col-fake .eyebrow::before{content:attr(data-letter);background:var(--c-accent);color:#fff;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:0;flex-shrink:0;font-family:'IBM Plex Sans',sans-serif}
  .placeholder-line{height:8px;border-radius:3px;background:var(--c-bg-alt);margin-bottom:8px}
  .placeholder-line.short{width:40%}
  .placeholder-line.med{width:70%}
  .placeholder-line.full{width:100%}
</style>
</head>
<body>
<div class="container">
  <span class="mock-tag">Option C · preview cards</span>
  <h1>A/B Test Calculator</h1>
  <span class="primer"><span class="pl-icon">i</span>New to A/B testing? Read the 4-min primer ▾</span>
  <p class="banner-sentence">I want to <span class="pill">analyze a finished test ▾</span> using <span class="pill">frequentist + Bayesian ▾</span> given <span class="pill">n_a = 1000, conv_a = 120, n_b = 1000, conv_b = 144 ▾</span></p>

  <div class="shell">
    <div class="scenarios-section">
      <div class="scenarios-label">Worked examples · click to load and see the answer</div>
      <div class="scenarios-grid">
        <button class="scenario-card">
          <div class="sc-head">
            <span class="sc-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2"/></svg></span>
            <span class="sc-name">Plan a 2-arm test</span>
          </div>
          <div class="sc-result"><span class="sc-arrow">→</span> need <b>n = 14,750</b> per arm <span class="mute">(baseline 10%, MDE +1pp)</span></div>
        </button>
        <button class="scenario-card active">
          <div class="sc-head">
            <span class="sc-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3.5" width="4" height="9" rx="0.5"/><rect x="9.5" y="3.5" width="4" height="9" rx="0.5"/></svg></span>
            <span class="sc-name">Analyze finished</span>
          </div>
          <div class="sc-result"><span class="sc-arrow">→</span> lift <span class="neu">+2.40pp</span>, p = <b>0.113</b> <span class="mute">· P(B&gt;A) 94.5%</span></div>
        </button>
        <button class="scenario-card">
          <div class="sc-head">
            <span class="sc-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13c2 0 3-2 4-5s2-5 3-5 1.5 2 2 5 1 5 1 5"/></svg></span>
            <span class="sc-name">Bayesian only</span>
          </div>
          <div class="sc-result"><span class="sc-arrow">→</span> P(B&gt;A) <span class="pos">96.0%</span>, mean lift <b>+3.0pp</b></div>
        </button>
        <button class="scenario-card">
          <div class="sc-head">
            <span class="sc-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><polyline points="8,4 8,8 11,10"/></svg></span>
            <span class="sc-name">Sequential look</span>
          </div>
          <div class="sc-result"><span class="sc-arrow">→</span> 3 looks, alpha = <b>0.022</b> per peek <span class="mute">(Pocock)</span></div>
        </button>
        <button class="scenario-card">
          <div class="sc-head">
            <span class="sc-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="6.5" r="3.5"/><line x1="9" y1="9" x2="13" y2="13"/></svg></span>
            <span class="sc-name">Long-tail conversion</span>
          </div>
          <div class="sc-result"><span class="sc-arrow">→</span> RR <b>5.0×</b>, p = <span class="pos">0.10</span> <span class="mute">(rare events, n=1000)</span></div>
        </button>
        <button class="scenario-card">
          <div class="sc-head">
            <span class="sc-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.5"/><path d="M8 1.5v2M8 12.5v2M14.5 8h-2M3.5 8h-2"/></svg></span>
            <span class="sc-name">Custom</span>
          </div>
          <div class="sc-result"><span class="sc-arrow">→</span> <span class="mute">enter your own counts and confidence level</span></div>
        </button>
      </div>
    </div>

    <div class="workshop-fake">
      <div class="col-fake"><div class="eyebrow" data-letter="A">Method</div><div class="placeholder-line med"></div><div class="placeholder-line full"></div><div class="placeholder-line short"></div></div>
      <div class="col-fake"><div class="eyebrow" data-letter="B">Measurements</div><div class="placeholder-line med"></div><div class="placeholder-line full"></div><div class="placeholder-line med"></div><div class="placeholder-line full"></div></div>
      <div class="col-fake"><div class="eyebrow" data-letter="C">Estimate</div><div class="placeholder-line short"></div><div class="placeholder-line med"></div><div class="placeholder-line full"></div><div class="placeholder-line full"></div></div>
    </div>
  </div>
</div>
</body>
</html>
