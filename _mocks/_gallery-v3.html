<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1560">
<title>v3 mocks side by side</title>
<style>
  body{margin:0;background:#eef1f6;font-family:'IBM Plex Sans',-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:20px 22px}
  h1{font-size:17px;margin:0 4px 4px;color:#1c2c4f;font-weight:700}
  p.sub{margin:0 4px 18px;font-size:12.5px;color:#5b6573;font-family:'IBM Plex Mono',monospace}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .cell{background:#fff;border:1px solid #d4d9e3;border-radius:11px;overflow:hidden;box-shadow:0 8px 22px -14px rgba(13,20,38,.32)}
  .cap{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:#1c2c4f;
    padding:10px 13px;border-bottom:1px solid #e4e7ee;background:#f8f9fb;display:flex;justify-content:space-between;align-items:baseline}
  .cap span{color:#8a96b5;font-weight:400;font-size:11px}
  .frame{position:relative;height:372px;overflow:hidden;background:#f8f9fb}
  .frame iframe{width:1366px;height:1020px;border:0;transform:scale(.362);transform-origin:top left}
</style>
</head>
<body>
  <h1>r-statistics.co &middot; v3 design mocks</h1>
  <p class="sub">tutorials &middot; exercises &middot; tools &middot; roadmap &middot; topic &middot; certification</p>
  <div class="grid">
    <div class="cell"><div class="cap">Tutorials <span>tutorials-mock-v3</span></div><div class="frame"><iframe src="tutorials-mock-v3.html" scrolling="no" loading="eager"></iframe></div></div>
    <div class="cell"><div class="cap">Exercises <span>exercises-mock-v3</span></div><div class="frame"><iframe src="exercises-mock-v3.html" scrolling="no" loading="eager"></iframe></div></div>
    <div class="cell"><div class="cap">Tools <span>tools-mock-v3</span></div><div class="frame"><iframe src="tools-mock-v3.html" scrolling="no" loading="eager"></iframe></div></div>
    <div class="cell"><div class="cap">Roadmap <span>roadmap-mock-v3</span></div><div class="frame"><iframe src="roadmap-mock-v3.html" scrolling="no" loading="eager"></iframe></div></div>
    <div class="cell"><div class="cap">Topic page <span>topic-mock-v3</span></div><div class="frame"><iframe src="topic-mock-v3.html" scrolling="no" loading="eager"></iframe></div></div>
    <div class="cell"><div class="cap">Certification <span>certification-mock-v3</span></div><div class="frame"><iframe src="certification-mock-v3.html" scrolling="no" loading="eager"></iframe></div></div>
  </div>
</body>
</html>
