<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verify Certificate | r-statistics.co</title>
<meta name="Description" content="Public verification page for r-statistics.co Mastery Certificates. Confirms a certificate was earned by passing a concept-and-code assessment.">
<meta name="Robots" content="noindex, follow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/screenshots/iconb-64.png" type="image/x-icon">
<link rel="canonical" href="https://r-statistics.co/verify-certificate.html">
<meta property="og:title" content="Verified r-statistics.co Mastery Certificate">
<meta property="og:description" content="This certificate was earned by passing a concept-and-code assessment on r-statistics.co.">
<meta property="og:type" content="article">
<meta property="og:url" content="https://r-statistics.co/verify-certificate.html">
<style>
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;font-display:swap;src:url('/www/fonts/ibm-plex/ibm-plex-sans-latin.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;src:url('/www/fonts/ibm-plex/ibm-plex-sans-latin.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Serif';font-style:normal;font-weight:600;font-display:swap;src:url('/www/fonts/ibm-plex/ibm-plex-serif-600.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Serif';font-style:normal;font-weight:700;font-display:swap;src:url('/www/fonts/ibm-plex/ibm-plex-serif-700.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url('/www/fonts/ibm-plex/ibm-plex-mono-400.woff2') format('woff2')}

  *,*::before,*::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: #0d1117;
    background: #fafbfc;
    min-height: 100vh;
  }

  .v-masthead {
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .v-brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 15px;
    color: #0d1117;
    text-decoration: none;
  }
  .v-mark {
    width: 32px; height: 32px;
    border-radius: 6px;
    background: #1d3158;
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Serif', Georgia, serif;
    font-style: italic;
    font-weight: 700;
    font-size: 19px;
  }
  .v-tld { color: #757a87; }
  .v-back { font-size: 13px; color: #4a5160; text-decoration: none; }

  .v-shell {
    max-width: 680px;
    margin: 0 auto;
    padding: 32px 24px 60px;
    text-align: center;
  }

  .v-status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-radius: 999px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 18px;
  }
  .v-status.verified {
    background: #e6f7eb;
    color: #1e7c3c;
    border: 1px solid #b8e7c5;
  }
  .v-status.invalid {
    background: #fbeeee;
    color: #c84444;
    border: 1px solid #f0c4c4;
  }
  .v-status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .v-status.verified .v-status-dot { background: #2a9b4a; }
  .v-status.invalid .v-status-dot { background: #c84444; }

  .v-headline {
    font-family: 'IBM Plex Serif', Georgia, serif;
    font-size: 28px;
    font-weight: 700;
    color: #0d1117;
    margin: 0 0 12px;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }
  .v-sub {
    font-size: 15px;
    line-height: 1.65;
    color: #4a5160;
    margin: 0 auto 28px;
    max-width: 460px;
  }

  /* Certificate — diploma grade. Matches the pass-screen cert in the quiz
     and the hero card on the hub: mineral cream ground, triple-inset border
     ('paper ticket' feel), 'VERIFIED' watermark rotated -8 deg behind the
     content, mineral ink-gold (#8a6313) accents. Element order: issuer →
     italic eyebrow ('This document certifies that') → italic-serif name →
     italic awarded label → serif title → seal → narrative → mono-caps meta. */
  .cert {
    position: relative;
    margin: 30px auto 28px;
    padding: 48px 40px 36px;
    background: #f7eedb;
    border-radius: 4px;
    max-width: 620px;
    overflow: hidden;
    box-shadow:
      inset 0 0 0 1px #e0d3a8,
      inset 0 0 0 5px #f7eedb,
      inset 0 0 0 6px #d8c382,
      0 4px 28px rgba(20, 30, 50, 0.06);
  }
  .cert-watermark {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Serif', Georgia, serif;
    font-size: 200px;
    font-weight: 700;
    color: #8a6313;
    opacity: 0.045;
    transform: rotate(-8deg);
    pointer-events: none;
    z-index: 1;
    user-select: none;
  }
  .cert-content { position: relative; z-index: 2; }
  .cert-issuer {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: #8a6313;
    margin: 0 0 26px;
    font-weight: 600;
  }
  .cert-eyebrow {
    font-family: 'IBM Plex Serif', Georgia, serif;
    font-style: italic;
    font-size: 13.5px;
    color: #5a5e68;
    margin: 0 0 8px;
  }
  .cert-seal {
    width: 64px; height: 64px;
    margin: 0 auto 14px;
    color: #8a6313;
    filter: drop-shadow(0 1px 2px rgba(138, 99, 19, 0.12));
  }
  .cert-seal svg { width: 100%; height: 100%; }
  .cert-title {
    font-family: 'IBM Plex Serif', Georgia, serif;
    font-size: 30px;
    font-weight: 700;
    color: #0d1117;
    margin: 0 0 4px;
    letter-spacing: -0.015em;
    line-height: 1.1;
  }
  .cert-awarded {
    font-family: 'IBM Plex Serif', Georgia, serif;
    font-style: italic;
    font-size: 13px;
    color: #5a4815;
    margin: 14px 0 4px;
  }
  .cert-name {
    font-family: 'IBM Plex Serif', Georgia, serif;
    font-style: italic;
    font-size: 30px;
    font-weight: 600;
    color: #0d1117;
    margin: 0 0 18px;
    line-height: 1.1;
  }
  .cert-narr {
    font-size: 14px;
    line-height: 1.6;
    color: #4a505e;
    margin: 14px auto 22px;
    max-width: 460px;
  }
  .cert-meta {
    display: flex;
    justify-content: center;
    gap: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: #8a6313;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin: 22px 0 0;
    padding: 16px 0 0;
    border-top: 1px solid rgba(216, 195, 130, 0.6);
    flex-wrap: wrap;
  }
  .cert-meta-row { display: inline-flex; align-items: center; gap: 6px; }
  .cert-meta-row strong {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #0d1117;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .cert-meta-dot { width: 3px; height: 3px; border-radius: 50%; background: #b88b1a; }

  .v-actions {
    margin: 28px 0 0;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  .v-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 22px;
    background: #fff;
    color: #1d3158;
    border: 1px solid #d8dce2;
    border-radius: 4px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .v-btn:hover { background: #f1f3f6; }
  .v-btn-primary {
    background: #0d1f3d;
    color: #fff;
    border-color: #0d1f3d;
  }
  .v-btn-primary:hover { background: #1a2f5a; color: #fff; }

  .v-trust {
    margin: 32px auto 0;
    padding: 18px 22px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    font-size: 13.5px;
    line-height: 1.6;
    color: #4a5160;
    text-align: left;
    max-width: 600px;
  }
  .v-trust h3 {
    font-family: 'IBM Plex Serif', Georgia, serif;
    font-size: 15px;
    font-weight: 600;
    color: #0d1117;
    margin: 0 0 8px;
  }
  .v-trust p { margin: 0 0 8px; }
  .v-trust p:last-child { margin: 0; }

  .v-footer {
    margin: 40px auto 0;
    max-width: 680px;
    padding: 24px 24px 32px;
    text-align: center;
    font-size: 13px;
    color: #757a87;
    border-top: 1px solid #e5e7eb;
  }
  .v-footer a { color: #1d3158; text-decoration: none; }
  .v-footer a:hover { text-decoration: underline; }

  @media (max-width: 600px) {
    .v-shell { padding: 16px 14px 40px; }
    .v-headline { font-size: 22px; }
    .cert { padding: 36px 24px 28px; }
    .cert-name { font-size: 24px; }
    .cert-title { font-size: 22px; }
    .cert-watermark { font-size: 140px; }
  }
</style>
</head>
<body>

<header class="v-masthead">
  <a class="v-brand" href="/">
    <span class="v-mark">R</span>
    <span>r&#8209;statistics<span class="v-tld">.co</span></span>
  </a>
  <a class="v-back" href="/">Home &rarr;</a>
</header>

<div class="v-shell" id="shell">
  <!-- Populated by JS -->
</div>

<footer class="v-footer">
  <p>&copy; 2016&ndash;2026 Selva Prabhakaran &middot;
    <a href="/about/">About r-statistics.co</a>
  </p>
</footer>

<script>
(function() {
  'use strict';

  var HUBS = {
    dplyr: {
      // Short title appears on the cert as the credential name.
      title: 'dplyr',
      // Long label is the certification full name (for tab title, sub-line).
      label: 'dplyr Mastery',
      narr: 'Awarded for passing a concept-and-code assessment of dplyr verbs, joins, and grouped operations on r-statistics.co.',
      quizUrl: '/dplyr-Exercises-in-R-quiz.html'
    }
  };

  var SEAL_SVG = '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<circle cx="24" cy="20" r="8.5" stroke-width="1.4"/>' +
    '<circle cx="24" cy="20" r="5.5" stroke-dasharray="1.5 2"/>' +
    '<path d="M21 20.5l2 2 4-4" stroke-width="1.6"/>' +
    '<path d="M14 14c-3.5 3.5-3.5 9.5 0 13.5"/>' +
    '<path d="M12.5 14.5c-1.5-.5-3-.3-4 .5"/>' +
    '<path d="M11.5 17.5c-1.5-.3-3 .2-4 1"/>' +
    '<path d="M11 20.5c-1.5 0-3 .5-4 1.5"/>' +
    '<path d="M11.5 23.5c-1.5.3-2.8 1-3.7 2"/>' +
    '<path d="M13 26.5c-1.3.6-2.4 1.5-3.2 2.7"/>' +
    '<path d="M34 14c3.5 3.5 3.5 9.5 0 13.5"/>' +
    '<path d="M35.5 14.5c1.5-.5 3-.3 4 .5"/>' +
    '<path d="M36.5 17.5c1.5-.3 3 .2 4 1"/>' +
    '<path d="M37 20.5c1.5 0 3 .5 4 1.5"/>' +
    '<path d="M36.5 23.5c1.5.3 2.8 1 3.7 2"/>' +
    '<path d="M35 26.5c1.3.6 2.4 1.5 3.2 2.7"/>' +
    '<path d="M18 30l-3 14 5-3 4 3 4-3 5 3-3-14"/>' +
    '</svg>';

  function b64urlDecode(s) {
    try {
      s = s.replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      return decodeURIComponent(escape(atob(s)));
    } catch (e) { return null; }
  }

  function getParam(name) {
    var m = new RegExp('[?&]' + name + '=([^&]+)').exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function formatDate(iso) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return null;
    var parts = iso.split('-');
    var d = new Date(parts[0], parseInt(parts[1], 10) - 1, parts[2]);
    if (isNaN(d.getTime())) return null;
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return months[d.getMonth()] + ' ' + parts[2] + ', ' + parts[0];
  }

  function shortId(name, hub, date) {
    var s = (name + '|' + hub + '|' + date).toLowerCase();
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
    var hex = (h >>> 0).toString(16).toUpperCase();
    while (hex.length < 8) hex = '0' + hex;
    return 'RST-' + hub.toUpperCase() + '-' + hex;
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, function(ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function renderInvalid(reason) {
    document.getElementById('shell').innerHTML =
      '<div class="v-status invalid"><span class="v-status-dot"></span>Unverified</div>' +
      '<h1 class="v-headline">No certificate to verify</h1>' +
      '<p class="v-sub">' + escapeHTML(reason) + '</p>' +
      '<div class="v-actions">' +
        '<a class="v-btn v-btn-primary" href="/posts/">Browse exercises</a>' +
        '<a class="v-btn" href="/">Home</a>' +
      '</div>' +
      '<div class="v-trust">' +
        '<h3>About r-statistics.co certificates</h3>' +
        '<p>Each certificate is issued only after the holder passes a concept-and-code, honor-coded assessment. The verification URL is generated at the moment the quiz is passed and encodes the recipient name, hub, and issue date.</p>' +
        '<p>A valid verification URL displays the recipient and date on this page. URLs that have been edited, truncated, or fabricated will render here as Unverified.</p>' +
      '</div>';
  }

  function renderVerified(name, hubKey, date) {
    var hub = HUBS[hubKey];
    var id = shortId(name, hubKey, date);
    var prettyDate = formatDate(date);
    // Element order matches the pass-screen cert and hub banner exactly:
    // issuer → italic eyebrow → italic-serif name → awarded label → title
    // → seal → narrative → mono-caps meta strip. Watermark sits behind.
    document.getElementById('shell').innerHTML =
      '<div class="v-status verified"><span class="v-status-dot"></span>&#10003; Verified</div>' +
      '<h1 class="v-headline">This certificate is genuine</h1>' +
      '<p class="v-sub">Issued by r-statistics.co after passing a concept-and-code, honor-coded assessment on ' + escapeHTML(hub.title) + '.</p>' +

      '<div class="cert">' +
        '<div class="cert-watermark" aria-hidden="true">VERIFIED</div>' +
        '<div class="cert-content">' +
          '<p class="cert-issuer">r-statistics.co &middot; Verifiable credential &middot; Public URL</p>' +
          '<p class="cert-eyebrow">This document certifies that</p>' +
          '<p class="cert-name">' + escapeHTML(name) + '</p>' +
          '<p class="cert-awarded">has demonstrated mastery of</p>' +
          '<p class="cert-title">' + escapeHTML(hub.title) + '</p>' +
          '<div class="cert-seal">' + SEAL_SVG + '</div>' +
          '<p class="cert-narr">' + escapeHTML(hub.narr) + '</p>' +
          '<div class="cert-meta">' +
            '<span class="cert-meta-row">Issued <strong>' + escapeHTML(prettyDate) + '</strong></span>' +
            '<span class="cert-meta-dot"></span>' +
            '<span class="cert-meta-row">ID <strong>' + escapeHTML(id) + '</strong></span>' +
            '<span class="cert-meta-dot"></span>' +
            '<span class="cert-meta-row">By <strong>r-statistics.co</strong></span>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="v-actions">' +
        '<a class="v-btn v-btn-primary" href="' + escapeHTML(hub.quizUrl) + '">Take the same assessment</a>' +
        '<a class="v-btn" href="/dplyr-Exercises-in-R.html">Browse the exercises</a>' +
      '</div>' +

      '<div class="v-trust">' +
        '<h3>How verification works</h3>' +
        '<p>The verification URL is generated when the assessment is passed. It encodes the recipient name, hub, and date directly so anyone reading this page can confirm the certificate&rsquo;s details without contacting us.</p>' +
        '<p>The eight-character ID above is derived from those same fields. Changing any one of them produces a different ID, so a tampered URL would not match the holder&rsquo;s saved record.</p>' +
      '</div>';

    document.title = name + ' — ' + hub.label + ' Certificate | r-statistics.co';
  }

  var nameParam = getParam('n');
  var hubParam = getParam('h');
  var dateParam = getParam('d');

  if (!nameParam || !hubParam || !dateParam) {
    renderInvalid('This page verifies r-statistics.co Mastery Certificates. Paste a full verification URL from a certificate to confirm its authenticity, or pass the dplyr quiz yourself to earn one.');
    return;
  }

  var name = b64urlDecode(nameParam);
  if (!name || name.length < 2 || name.length > 80) {
    renderInvalid('The recipient name on this URL appears to be corrupted or missing. The certificate cannot be verified.');
    return;
  }

  if (!HUBS[hubParam]) {
    renderInvalid('No certificate program named "' + escapeHTML(hubParam) + '" exists on r-statistics.co.');
    return;
  }

  if (!formatDate(dateParam)) {
    renderInvalid('The issue date on this URL appears to be invalid.');
    return;
  }

  renderVerified(name, hubParam, dateParam);
})();
</script>

</body>
</html>
