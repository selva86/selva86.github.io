<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saved posts &middot; r-statistics.co</title>
  <meta name="description" content="Your saved r-statistics.co tutorials.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://r-statistics-co.pages.dev/saved-posts.html">
  <link rel="shortcut icon" href="/screenshots/iconb-64.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f8f9fb;--surface:#fff;--ink:#0a0d14;--ink-2:#1f2533;
      --mute:#4b5260;--mute-2:#6b7280;--faint:#6b7280;
      --line:#e4e7ee;--border:#d4d9e3;
      --navy:#1c2c4f;--navy-2:#2d4173;--acc:#2056d2;--acc-h:#1842a8;
      --acc-soft:#e9efff;--success:#137a3e;--danger:#9a1f1f;--danger-soft:#fbe2e2;
      --r:10px;--r-sm:6px;--r-md:13px;
      --sh:0 4px 12px -4px rgba(10,13,20,.08),0 2px 4px -2px rgba(10,13,20,.05);
      --ease:cubic-bezier(.22,.61,.36,1);
    }
    body{
      font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
      color:var(--ink);background:var(--bg);min-height:100vh;
      font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
    }
    a{color:var(--acc);text-decoration:none}
    .topbar{
      background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;
      display:flex;align-items:center;justify-content:space-between;
    }
    .brand{display:flex;align-items:center;gap:9px;
      font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;color:var(--ink);
      text-decoration:none;}
    .brand .mark{
      width:28px;height:28px;border-radius:7px;
      background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;
      display:flex;align-items:center;justify-content:center;
      font-family:'IBM Plex Serif',Georgia,serif;font-style:italic;font-weight:700;
      font-size:16px;letter-spacing:-.04em;
    }
    .brand .co{color:var(--faint)}
    .topbar-right{display:flex;align-items:center;gap:14px}
    .topbar-right a{font-size:13.5px;font-weight:500;color:var(--mute)}
    .topbar-right a:hover{color:var(--ink)}
    .btn-signout{
      padding:7px 14px;background:#fff;color:var(--ink);
      border:1px solid var(--border);border-radius:var(--r-sm);
      font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;
      transition:border-color .15s var(--ease);
    }
    .btn-signout:hover{border-color:var(--danger);color:var(--danger)}

    .wrap{max-width:860px;margin:0 auto;padding:36px 20px}
    h1{font-family:'IBM Plex Serif',Georgia,serif;font-weight:600;
      font-size:30px;letter-spacing:-.02em;margin-bottom:6px;color:var(--ink)}
    .lead{color:var(--mute);font-size:15px;margin-bottom:24px}

    .booting{text-align:center;color:var(--faint);padding:80px 0;font-size:14px}
    .spinner{
      display:inline-block;width:14px;height:14px;border:2px solid currentColor;
      border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;
      vertical-align:-2px;margin-right:6px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    .slist{display:flex;flex-direction:column;gap:10px}
    .srow{
      background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
      padding:16px 18px;display:grid;
      grid-template-columns:1fr auto auto;gap:12px;align-items:center;
      transition:border-color .15s var(--ease);
    }
    .srow:hover{border-color:var(--ink-2)}
    .srow .main{display:block;color:inherit;text-decoration:none;min-width:0}
    .srow .main:hover h3{color:var(--acc)}
    .srow .main h3{font-family:'IBM Plex Serif',Georgia,serif;font-weight:600;
      font-size:16px;line-height:1.35;color:var(--ink);margin-bottom:3px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .15s}
    .srow .slug{font-size:12px;color:var(--faint);font-family:'IBM Plex Mono',monospace;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .srow .mt{font-size:12.5px;color:var(--faint);white-space:nowrap}
    .srow .remove{
      background:none;border:1px solid var(--border);border-radius:50%;
      width:30px;height:30px;display:flex;align-items:center;justify-content:center;
      color:var(--faint);cursor:pointer;font-size:16px;line-height:1;font-family:inherit;
      transition:all .15s var(--ease);flex:none;
    }
    .srow .remove:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
    .srow .remove:disabled{opacity:.5;cursor:wait}

    .empty{
      text-align:center;background:var(--surface);border:1px dashed var(--border);
      border-radius:var(--r-md);padding:60px 30px;color:var(--mute);
    }
    .empty h2{font-family:'IBM Plex Serif',Georgia,serif;font-weight:600;
      font-size:20px;margin-bottom:8px;color:var(--ink)}
    .empty p{font-size:14px;line-height:1.65;margin-bottom:16px}
    .empty .cta{
      display:inline-block;padding:10px 18px;background:var(--acc);color:#fff;
      border-radius:var(--r-sm);font-size:14px;font-weight:500;
    }
    .empty .cta:hover{background:var(--acc-h);text-decoration:none}

    .count{font-size:13px;color:var(--faint);margin-bottom:14px}
    .pagination{
      display:flex;justify-content:center;gap:10px;margin-top:24px;
    }
    .pagination button{
      padding:8px 16px;background:#fff;color:var(--ink);
      border:1px solid var(--border);border-radius:var(--r-sm);
      font-family:inherit;font-size:13.5px;cursor:pointer;
    }
    .pagination button:disabled{opacity:.4;cursor:not-allowed}

    .msg.error{
      background:var(--danger-soft);color:var(--danger);border:1px solid #f0b4b4;
      padding:14px 18px;border-radius:var(--r-sm);font-size:14px;margin-bottom:18px;
    }

    .hidden{display:none!important}

    @media(max-width:600px){
      .wrap{padding:24px 14px}
      .srow{grid-template-columns:1fr auto;gap:8px}
      .srow .mt{display:none}
    }
  </style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="/"><span class="mark">R</span>r-statistics<span class="co">.co</span></a>
  <div class="topbar-right">
    <a href="/account.html">Account</a>
    <button class="btn-signout auth-signout" type="button">Sign out</button>
  </div>
</header>

<div class="wrap">

  <div class="booting" id="booting"><span class="spinner"></span>Loading your saved posts...</div>

  <div id="ui" class="hidden">
    <h1>Saved posts</h1>
    <p class="lead">Tutorials you bookmarked. Synced across every device.</p>

    <div class="msg error hidden" id="error-msg"></div>

    <div class="count" id="count"></div>
    <div class="slist" id="list"></div>

    <div class="empty hidden" id="empty">
      <h2>Nothing saved yet</h2>
      <p>Bookmark any tutorial you want to come back to. They'll appear here.</p>
      <a class="cta" href="/">Browse tutorials</a>
    </div>

    <div class="pagination hidden" id="pagination">
      <button id="btn-prev" type="button">Previous</button>
      <button id="btn-next" type="button">Next</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';

const PAGE_SIZE = 25;
let currentOffset = 0;
let supabaseClient = null;
let accessToken = null;
let titlesIndex = null; // slug -> title from sidebar.json

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.classList.remove('hidden');
}

function relativeTime(unixSec) {
  if (!unixSec) return '';
  const ago = Math.floor(Date.now() / 1000) - unixSec;
  if (ago < 60) return 'just now';
  if (ago < 3600) return Math.floor(ago / 60) + ' min ago';
  if (ago < 86400) return Math.floor(ago / 3600) + ' hr ago';
  const days = Math.floor(ago / 86400);
  if (days === 1) return 'yesterday';
  if (days < 7) return days + ' days ago';
  if (days < 30) return Math.floor(days / 7) + ' wk ago';
  if (days < 365) return Math.floor(days / 30) + ' mo ago';
  return Math.floor(days / 365) + ' yr ago';
}

// Build slug -> title index from sidebar.json. Falls back to slug if title not found.
async function loadTitles() {
  if (titlesIndex) return titlesIndex;
  titlesIndex = {};
  try {
    const resp = await fetch('/www/sidebar.json');
    if (resp.ok) {
      const data = await resp.json();
      // sidebar.json is an array of sections; each section.items is [{href, text}, ...]
      for (const section of data) {
        if (!Array.isArray(section.items)) continue;
        for (const item of section.items) {
          if (item.href && item.text) {
            const slug = item.href.replace(/^\//, '').replace(/\.html?$/, '');
            titlesIndex[slug] = item.text;
          }
        }
      }
    }
  } catch (_) { /* fall through; titles will fallback to slugs */ }
  return titlesIndex;
}

function titleFor(slug) {
  return (titlesIndex && titlesIndex[slug]) || slug.replace(/-/g, ' ');
}

function urlFor(slug) {
  return '/' + slug + '.html';
}

async function fetchPage(offset) {
  const url = `/api/me/saved?limit=${PAGE_SIZE}&offset=${offset}`;
  const resp = await fetch(url, {
    headers: { 'Authorization': 'Bearer ' + accessToken, 'Accept': 'application/json' },
  });
  if (!resp.ok) throw new Error('Could not fetch saved posts (status ' + resp.status + ')');
  return await resp.json();
}

async function removeOne(slug, btn) {
  btn.disabled = true;
  try {
    const resp = await fetch('/api/save/' + encodeURIComponent(slug), {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + accessToken, 'Accept': 'application/json' },
    });
    if (!resp.ok) throw new Error('remove failed');
    // Animate out then reload current page.
    const row = btn.closest('.srow');
    if (row) {
      row.style.transition = 'opacity .2s, transform .2s';
      row.style.opacity = '0';
      row.style.transform = 'translateX(20px)';
      setTimeout(() => render(currentOffset), 220);
    } else {
      render(currentOffset);
    }
  } catch (_) {
    btn.disabled = false;
    showError('Could not remove that post. Try again.');
  }
}

function rowHtml(item) {
  const title = titleFor(item.slug);
  const href = urlFor(item.slug);
  return `
    <div class="srow" data-slug="${item.slug.replace(/"/g, '&quot;')}">
      <a class="main" href="${href}">
        <h3>${title}</h3>
        <div class="slug">${item.slug}</div>
      </a>
      <div class="mt">Saved ${relativeTime(item.saved_at)}</div>
      <button class="remove" title="Remove from saved" type="button">&times;</button>
    </div>
  `;
}

async function render(offset) {
  currentOffset = offset;
  document.getElementById('error-msg').classList.add('hidden');
  let page;
  try {
    page = await fetchPage(offset);
  } catch (e) {
    showError(e.message || 'Could not load');
    return;
  }
  const items = page.items || [];
  const total = page.total;
  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('empty');
  const countEl = document.getElementById('count');
  const pagEl = document.getElementById('pagination');

  if (items.length === 0 && offset === 0) {
    listEl.innerHTML = '';
    emptyEl.classList.remove('hidden');
    countEl.textContent = '';
    pagEl.classList.add('hidden');
    return;
  }

  emptyEl.classList.add('hidden');
  listEl.innerHTML = items.map(rowHtml).join('');
  countEl.textContent = total != null
    ? `${total} saved`
    : `${items.length}+ saved`;

  // Wire remove buttons.
  listEl.querySelectorAll('.srow').forEach(row => {
    const slug = row.dataset.slug;
    const btn = row.querySelector('.remove');
    btn.addEventListener('click', () => removeOne(slug, btn));
  });

  // Pagination visibility.
  const hasPrev = offset > 0;
  const hasNext = page.has_more;
  if (hasPrev || hasNext) {
    pagEl.classList.remove('hidden');
    document.getElementById('btn-prev').disabled = !hasPrev;
    document.getElementById('btn-next').disabled = !hasNext;
  } else {
    pagEl.classList.add('hidden');
  }
}

(async function init() {
  // Load auth config + Supabase client.
  let cfg;
  try {
    const resp = await fetch('/api/_auth-config');
    if (!resp.ok) throw new Error('config endpoint returned ' + resp.status);
    cfg = await resp.json();
  } catch (e) {
    document.getElementById('booting').innerHTML =
      '<div class="msg error">Could not load auth config: ' + (e.message || '') + '</div>';
    return;
  }

  supabaseClient = createClient(cfg.url, cfg.anonKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, flowType: 'implicit' },
  });

  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) {
    window.location.replace('/signin.html?next=' + encodeURIComponent('/saved-posts.html'));
    return;
  }
  accessToken = session.access_token;

  // Load titles index in parallel with first render attempt.
  await loadTitles();

  document.getElementById('booting').classList.add('hidden');
  document.getElementById('ui').classList.remove('hidden');

  // Sign-out button.
  document.querySelector('.auth-signout').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.replace('/signin.html');
  });

  document.getElementById('btn-prev').addEventListener('click', () => render(Math.max(0, currentOffset - PAGE_SIZE)));
  document.getElementById('btn-next').addEventListener('click', () => render(currentOffset + PAGE_SIZE));

  await render(0);
})();
</script>

</body>
</html>
