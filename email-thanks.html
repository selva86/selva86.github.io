<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noted · r-statistics.co</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/screenshots/iconb-64.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f7faf8;--card:#fff;--ink:#0f1a2b;--body:#3b4657;--mut:#6b7280;--line:#e1e7ee;--green:#1f7a55;--green-deep:#0d3826}
  html.dark{--paper:#0b1120;--card:#101830;--ink:#eef2fa;--body:#c5cee0;--mut:#9aa6c0;--line:#1f2a48;--green:#3fae7c;--green-deep:#0f2e22}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 Inter,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
  .wordmark{margin:28px 0 0;text-align:center;font:700 22px 'Inter Tight',sans-serif}
  .wordmark a{color:var(--ink);text-decoration:none}.wordmark .dot{color:var(--green)}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 20px}
  .card{background:var(--card);border:1px solid var(--line);max-width:520px;width:100%;padding:34px 34px 30px}
  h1{font:700 26px/1.2 'Inter Tight',sans-serif;margin:0 0 12px;letter-spacing:-.01em}
  p{margin:0 0 14px;color:var(--body)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
  .chips a{border:1px solid var(--line);padding:8px 13px;font-size:14px;font-weight:500;color:var(--ink);text-decoration:none;background:var(--card)}
  .chips a:hover{border-color:var(--green);color:var(--green)}
  .back{display:inline-block;margin-top:18px;color:var(--green);font-weight:600;text-decoration:none}
  .fine{font-size:13px;color:var(--mut);margin-top:16px}
  footer{text-align:center;color:var(--mut);font-size:13px;padding:18px}
</style>
</head>
<body>
<p class="wordmark"><a href="/">R<span class="dot">.</span></a></p>
<main>
  <div class="card" id="card">
    <h1 id="h">Noted, thank you.</h1>
    <p id="p">That went straight to me.</p>
    <div class="chips" id="chips" hidden></div>
    <a class="back" href="/dashboard.html" id="back">Back to your dashboard &rarr;</a>
    <p class="fine" id="fine" hidden></p>
  </div>
</main>
<footer>r-statistics.co &middot; Akshay reads every reply.</footer>
<script>
(function(){
  try { if (localStorage.getItem('rsc-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
  var q = new URLSearchParams(location.search);
  var t = q.get('t') || '', v = q.get('v') || '', w = q.get('w') || '', d = q.get('d') || '';
  var h = document.getElementById('h'), p = document.getElementById('p'), chips = document.getElementById('chips'), fine = document.getElementById('fine');
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
  if (t === 'vote') {
    if (v === 'up') {
      h.textContent = 'Glad it was worth it.';
      p.textContent = 'That one click tells me more than any dashboard. If you feel like saying why, one more tap:';
      chips.hidden = false;
      chips.innerHTML = ['loved_it:It clicked for me','too_easy:A bit easy','too_long:A bit long'].map(function(x){
        var kv = x.split(':'); return '<a href="' + esc(link('reason:' + kv[0])) + '">' + esc(kv[1]) + '</a>';
      }).join('');
    } else if (v === 'down') {
      h.textContent = 'Thank you for being honest.';
      p.textContent = 'Not every lesson lands for everyone, and knowing which ones miss is how the series gets better. One more tap if you can spare it:';
      chips.hidden = false;
      chips.innerHTML = ['too_hard:Too hard','too_easy:Too easy','not_my_topic:Not my topic','too_long:Too long'].map(function(x){
        var kv = x.split(':'); return '<a href="' + esc(link('reason:' + kv[0])) + '">' + esc(kv[1]) + '</a>';
      }).join('');
    } else if (v.indexOf('reason:') === 0) {
      h.textContent = 'Noted, thank you.';
      p.textContent = 'That is exactly the kind of note that changes what gets written next. See you tomorrow.';
    }
  } else if (t === 'intent') {
    if (w === 'today') { h.textContent = 'Today it is.'; p.textContent = 'I will send your code within the hour. Watch your inbox, and check the promotions tab if it hides.'; }
    else if (w === 'week') { h.textContent = 'This week, noted.'; p.textContent = 'Your code will arrive tomorrow, so it lands while you are still deciding and not after.'; }
    else if (w === 'month') { h.textContent = 'A month or two, noted.'; p.textContent = 'I will hold off and send your code in about three weeks, when it is actually useful, not now when it would just expire.'; }
    else if (w === 'renew') { h.textContent = 'Back on the list.'; p.textContent = 'The next time there is a discount, you hear about it first. Until then, nothing.'; }
    else { h.textContent = 'Someday, noted.'; p.textContent = 'No rush from my side. I will send a code when the next occasion comes around, and never before.'; }
  } else if (t === 'paused') {
    h.textContent = 'Paused for ' + (d || '14') + ' days.';
    p.textContent = 'The lessons pick up again on their own, right where you left off. Nothing you finished is lost.';
  } else if (t === 'keep') {
    h.textContent = 'Keeping them coming.';
    p.textContent = 'Tomorrow morning as usual. Thank you for telling me.';
  } else if (t === 'stopped') {
    h.textContent = 'Done. No more discount emails.';
    p.textContent = 'The lessons and everything free on the site stay exactly as they are.';
  } else if (t === 'invalid') {
    h.textContent = 'That link did not work.';
    p.textContent = 'It may have been edited or expired. Nothing was changed.';
  }
  function link(val){
    return '/api/email/vote?u=' + encodeURIComponent(q.get('u') || '') + '&k=' + encodeURIComponent(q.get('k') || '') +
      '&t=' + encodeURIComponent(q.get('s') || '') + '&v=' + encodeURIComponent(val);
  }
})();
</script>
</body>
</html>
