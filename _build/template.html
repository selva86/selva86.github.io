  <!-- Mobile sidebar menu -->
  <script>
    (function() {
      var menuBtn = document.getElementById('mobile-menu-btn');
      var overlay = document.getElementById('mobile-sidebar');
      var closeBtn = document.getElementById('mobile-sidebar-close');
      var mobileContent = document.getElementById('mobile-sidebar-content');
      if (!menuBtn || !overlay) return;

      // Populate mobile sidebar from #sidebar-nav after it loads
      function populateMobileSidebar() {
        var sidebarNav = document.getElementById('sidebar-nav');
        if (sidebarNav && sidebarNav.innerHTML.trim()) {
          mobileContent.innerHTML = sidebarNav.innerHTML;
          // Re-attach click handlers for section toggles
          mobileContent.querySelectorAll('.sidebar-section-header').forEach(function(h) {
            h.addEventListener('click', function() {
              this.closest('.sidebar-section').classList.toggle('expanded');
            });
          });
        }
      }

      menuBtn.addEventListener('click', function() {
        populateMobileSidebar();
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
      });
      closeBtn.addEventListener('click', function() {
        overlay.classList.remove('open');
        document.body.style.overflow = '';
      });
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) {
          overlay.classList.remove('open');
          document.body.style.overflow = '';
        }
      });
    })();
  </script>

  <!-- Image lightbox -->
  <div class="img-lightbox" id="img-lightbox"><img alt="" /></div>
  <script>
    (function(){
      var lb=document.getElementById('img-lightbox'),lbImg=lb.querySelector('img');
      document.addEventListener('click',function(e){
        var img=e.target.closest('.img-zoomable');
        if(img){lbImg.src=img.src;lbImg.alt=img.alt;lb.classList.add('open');document.body.style.overflow='hidden';}
      });
      lb.addEventListener('click',function(){lb.classList.remove('open');document.body.style.overflow='';});
      document.addEventListener('keydown',function(e){if(e.key==='Escape'&&lb.classList.contains('open')){lb.classList.remove('open');document.body.style.overflow='';}});
    })();
  </script>

  <!-- Google site search -->
  <script>
    function my_search_google() {
      var query = document.getElementById("my-google-search").value;
      window.open("https://google.com/search?q=" + query + "%20site:https://r-statistics.co");
    }
  </script>

  <!-- Dark mode toggle + smooth scroll -->
  <script>
    // Dark mode
    (function() {
      var btn = document.getElementById('dark-mode-toggle');
      if (!btn) return;
      var saved = localStorage.getItem('darkMode');
      if (saved === 'true') { document.documentElement.classList.add('dark'); btn.textContent = '\u2600'; }
      btn.addEventListener('click', function() {
        var isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('darkMode', isDark);
        btn.textContent = isDark ? '\u2600' : '\u263D';
      });
    })();

    // Smooth scroll for TOC and anchor links
    document.addEventListener('click', function(e) {
      var link = e.target.closest('a[href^="#"]');
      if (!link) return;
      var target = document.querySelector(link.getAttribute('href'));
      if (!target) return;
      e.preventDefault();
      var offset = 20;
      var top = target.getBoundingClientRect().top + window.pageYOffset - offset;
      window.scrollTo({ top: top, behavior: 'smooth' });
      history.pushState(null, null, link.getAttribute('href'));
    });
  </script>
