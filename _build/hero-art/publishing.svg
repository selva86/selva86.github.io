<svg class="hero-art" viewBox="0 0 520 300" role="img" aria-label="A manuscript page marked up by a reviewer, with a margin comment." xmlns="http://www.w3.org/2000/svg">
  <!-- the manuscript -->
  <rect x="40" y="18" width="290" height="264" rx="10" fill="#fff" stroke="#e7e4da"/>
  <rect x="64" y="46" width="152" height="11" rx="3" fill="#16181d"/>
  <rect x="64" y="68" width="96" height="7" rx="3" fill="#cfc9b8"/>

  <rect x="64" y="96" width="242" height="6" rx="3" fill="#ddd8ca"/>
  <rect x="64" y="111" width="228" height="6" rx="3" fill="#ddd8ca"/>
  <rect x="64" y="126" width="236" height="6" rx="3" fill="#ddd8ca"/>

  <!-- the figure the reviewer is objecting to -->
  <rect x="64" y="150" width="112" height="66" rx="6" fill="#faf9f5" stroke="#eee9dc"/>
  <rect x="76" y="192" width="12" height="16" rx="2" fill="#cfc9b8"/>
  <rect x="94" y="180" width="12" height="28" rx="2" fill="#cfc9b8"/>
  <rect x="112" y="170" width="12" height="38" rx="2" fill="#9a3324" fill-opacity=".55"/>
  <rect x="130" y="184" width="12" height="24" rx="2" fill="#cfc9b8"/>
  <rect x="148" y="176" width="12" height="32" rx="2" fill="#cfc9b8"/>

  <rect x="188" y="156" width="118" height="6" rx="3" fill="#ddd8ca"/>
  <rect x="188" y="171" width="104" height="6" rx="3" fill="#ddd8ca"/>
  <rect x="188" y="186" width="116" height="6" rx="3" fill="#ddd8ca"/>
  <rect x="188" y="201" width="88" height="6" rx="3" fill="#ddd8ca"/>

  <rect x="64" y="238" width="242" height="6" rx="3" fill="#ddd8ca"/>
  <rect x="64" y="253" width="176" height="6" rx="3" fill="#ddd8ca"/>

  <!-- the reviewer's marks -->
  <path d="M54 92 h-8 v48 h8" fill="none" stroke="#9a3324" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M64 122 q7 -5 14 0 t14 0 t14 0 t14 0 t14 0 t14 0" fill="none" stroke="#9a3324" stroke-width="1.6" stroke-linecap="round"/>
  <ellipse cx="120" cy="183" rx="70" ry="45" fill="none" stroke="#9a3324" stroke-width="1.7" stroke-dasharray="5 7" stroke-opacity=".75"/>

  <!-- the comment in the margin -->
  <path d="M352 132 l-14 8 l14 8 z" fill="#fff" stroke="#e7e4da" stroke-linejoin="round"/>
  <rect x="351" y="98" width="150" height="88" rx="12" fill="#fff" stroke="#e7e4da"/>
  <circle cx="371" cy="121" r="6" fill="#9a3324"/>
  <rect x="385" y="117" width="58" height="7" rx="3.5" fill="#16181d"/>
  <rect x="367" y="140" width="118" height="6" rx="3" fill="#ddd8ca"/>
  <rect x="367" y="154" width="96" height="6" rx="3" fill="#ddd8ca"/>
  <rect x="367" y="168" width="72" height="6" rx="3" fill="#ddd8ca"/>
