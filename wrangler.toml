# Cloudflare Pages + Functions configuration.
# Bindings reference resources you create with `wrangler` CLI (see BUILD-PHASE-0.md).
# Run `wrangler pages deploy .` to push; CF Pages picks up `functions/` automatically.

name = "r-statistics-co"
pages_build_output_dir = "."
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# ===== Production environment =====
# Bindings here apply when `wrangler.toml` is used without `--env`.
# Fill the IDs in after running the wrangler create commands in BUILD-PHASE-0.md.

[[d1_databases]]
binding = "DB"
database_name = "r-stats-prod"
database_id = "5bde3a70-a477-4a50-b812-f71306c517a5"

[[kv_namespaces]]
binding = "KV"
id = "9c3ed75a39954e6190b73b8f1d5229b5"

[[r2_buckets]]
binding = "CERTS"
bucket_name = "r-stats-certs"

[[r2_buckets]]
binding = "AVATARS"
bucket_name = "r-stats-avatars"

[[r2_buckets]]
binding = "EXPORTS"
bucket_name = "r-stats-exports"

[[r2_buckets]]
binding = "COURSE_MEDIA"
bucket_name = "r-stats-course-media"

[vars]
ENVIRONMENT = "production"
SITE_ORIGIN = "https://r-statistics.co"

# ===== Preview environment =====
# CF Pages only supports two named envs: `production` (default, master branch)
# and `preview` (every non-master branch, including PR previews).
# Preview bindings point at the dev resources so PR previews stay isolated from prod.

[env.preview]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "r-stats-dev"
database_id = "db1a5e27-28f3-4108-a018-fa27f3872719"

[[env.preview.kv_namespaces]]
binding = "KV"
id = "d4cff0e65ec340d283dc0ac71c8446cd"

[[env.preview.r2_buckets]]
binding = "CERTS"
bucket_name = "r-stats-certs-dev"

[[env.preview.r2_buckets]]
binding = "AVATARS"
bucket_name = "r-stats-avatars-dev"

[[env.preview.r2_buckets]]
binding = "EXPORTS"
bucket_name = "r-stats-exports-dev"

[[env.preview.r2_buckets]]
binding = "COURSE_MEDIA"
bucket_name = "r-stats-course-media-dev"

[env.preview.vars]
ENVIRONMENT = "development"
SITE_ORIGIN = "http://localhost:8788"
# Supabase client config for branch previews. These two are PUBLIC by design -
# prod's /api/_auth-config serves them verbatim to every browser (the anon key
# is the client-side key, protected by RLS). Without them, _auth-config 503s on
# preview deployments and sign-in is impossible there, which makes any
# signed-in feature untestable before merge. Real secrets stay out of this
# file per the note below.
SUPABASE_URL = "https://tnodbdvxmevablbvhgym.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRub2RiZHZ4bWV2YWJsYnZoZ3ltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NjIzMjEsImV4cCI6MjA5NTEzODMyMX0.fFzu62wSoFX7cuOJT3sIOo32ffNR6lFbErHCOZBRwSQ"

# The two ANNUAL price ids, so /api/offer can answer on a branch preview.
# Public by design: prod hands both to every browser from /api/_auth-config,
# which is how pricing.html opens a checkout. Identifiers, not credentials.
# Without them a preview reports no_prices and every offer surface stays
# silent, so the discount cannot be verified before it reaches master.
PADDLE_PRICE_SINGLE_YEAR = "pri_01kxxr2051fr1dc7ah9penkta0"
PADDLE_PRICE_AA_YEAR = "pri_01kxxr20ncg9k7xed34p76crv1"

# The quarterly All-Access price. It is sold from the roadmap Pro panel and
# nowhere else, so a preview needs it here or that panel shows two plans
# instead of three and the new one cannot be clicked before it reaches master.
# Production reads the same name from its own environment.
PADDLE_PRICE_AA_QUARTER = "pri_01m774007c31e1aj7e942t785t"

# The remaining three individual prices, added 2026-11-13. The announcement
# strip's code covers EVERY individual plan, not just the annual ones, and
# allPlanPriceIds() refuses outright unless all six resolve: it will not send
# a partial restrict_to, because that would advertise a discount on plans the
# code cannot touch and the reader would find out at checkout. With only the
# three above, every preview answered no_prices and the offer arm of the strip
# could not be seen at all before merging. Same justification as the others:
# production hands all six to every browser from /api/_auth-config.
#
# These cannot mint anything here. The preview environment has no
# PADDLE_API_KEY (it holds only EDGE_ID_SECRET and the two lock price ids), and
# mintPersonalOffer returns null without that key, so a preview can render the
# offer and never create a real discount. That is the intended split: the
# surface is reviewable, the money path is not reachable.
PADDLE_PRICE_SINGLE_MONTH = "pri_01m758zxfmn37rdeb7sn64y3tm"
PADDLE_PRICE_AA_MONTH = "pri_01m758zwytdcq5tavzs7njfdnp"
PADDLE_PRICE_LIFETIME = "pri_01m758zxz9why17p9ag4c3s2sa"

# Secrets (set via `wrangler pages secret put <NAME>`, never in this file):
#   SUPABASE_JWT_SECRET, SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
#   PADDLE_API_KEY, PADDLE_WEBHOOK_SECRET
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET
#   ZOHO_AUTH_TOKEN, ZOHO_LIST_KEY                    (Zoho Campaigns - newsletter)
#   ZOHO_ZEPTOMAIL_TOKEN, ZOHO_ZEPTOMAIL_SENDER       (Zoho ZeptoMail - transactional)
#   SENTRY_DSN
