# Cloudflare Pages + Functions configuration.
# Bindings reference resources you create with `wrangler` CLI (see BUILD-PHASE-0.md).
# Run `wrangler pages deploy .` to push; CF Pages picks up `functions/` automatically.

name = "r-statistics-co"
pages_build_output_dir = "."
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# ===== Static-asset serving =====
# TEST (phase8-cutover-prep): preserve .html URLs — stop CF's default
# 308 redirect of /X.html -> /X so 1,300+ indexed .html URLs keep serving 200.
# html_handling="none" disables extension-stripping (and index auto-serve, so
# `/` is handled explicitly below). Validate on the preview before merging.
[assets]
html_handling = "none"
not_found_handling = "404-page"

# ===== Production environment =====
# Bindings here apply when `wrangler.toml` is used without `--env`.
# Fill the IDs in after running the wrangler create commands in BUILD-PHASE-0.md.

[[d1_databases]]
binding = "DB"
database_name = "r-stats-prod"
database_id = "5bde3a70-a477-4a50-b812-f71306c517a5"

[[kv_namespaces]]
binding = "KV"
id = "9c3ed75a39954e6190b73b8f1d5229b5"

[[r2_buckets]]
binding = "CERTS"
bucket_name = "r-stats-certs"

[[r2_buckets]]
binding = "AVATARS"
bucket_name = "r-stats-avatars"

[[r2_buckets]]
binding = "EXPORTS"
bucket_name = "r-stats-exports"

[[r2_buckets]]
binding = "COURSE_MEDIA"
bucket_name = "r-stats-course-media"

[vars]
ENVIRONMENT = "production"
SITE_ORIGIN = "https://r-statistics.co"

# ===== Preview environment =====
# CF Pages only supports two named envs: `production` (default, master branch)
# and `preview` (every non-master branch, including PR previews).
# Preview bindings point at the dev resources so PR previews stay isolated from prod.

[env.preview]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "r-stats-dev"
database_id = "db1a5e27-28f3-4108-a018-fa27f3872719"

[[env.preview.kv_namespaces]]
binding = "KV"
id = "d4cff0e65ec340d283dc0ac71c8446cd"

[[env.preview.r2_buckets]]
binding = "CERTS"
bucket_name = "r-stats-certs-dev"

[[env.preview.r2_buckets]]
binding = "AVATARS"
bucket_name = "r-stats-avatars-dev"

[[env.preview.r2_buckets]]
binding = "EXPORTS"
bucket_name = "r-stats-exports-dev"

[[env.preview.r2_buckets]]
binding = "COURSE_MEDIA"
bucket_name = "r-stats-course-media-dev"

[env.preview.vars]
ENVIRONMENT = "development"
SITE_ORIGIN = "http://localhost:8788"

# Secrets (set via `wrangler pages secret put <NAME>`, never in this file):
#   SUPABASE_JWT_SECRET, SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
#   PADDLE_API_KEY, PADDLE_WEBHOOK_SECRET
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET
#   ZOHO_AUTH_TOKEN, ZOHO_LIST_KEY                    (Zoho Campaigns - newsletter)
#   ZOHO_ZEPTOMAIL_TOKEN, ZOHO_ZEPTOMAIL_SENDER       (Zoho ZeptoMail - transactional)
#   SENTRY_DSN
