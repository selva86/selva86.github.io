<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Contacts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&display=swap">
<style>
  :root{
    --ink:#11151c; --ink2:#3d4552; --faint:#6b7480; --hair:#e6e9ee; --hair2:#f2f4f7;
    --bg:#fff; --wash:#f7f8fa; --blue:#2056d2;
    --green:#1f7a55; --green-w:#eaf6f0; --amber:#9a6a00; --amber-w:#fdf4e3;
    --red:#b23c3c; --red-w:#fceeee; --grey:#8a9099; --grey-w:#f2f3f5;
    --violet:#5b3fa8; --violet-w:#f1edfb;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--wash);color:var(--ink);
       font:400 14px/1.5 -apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  .wrap{max-width:1500px;margin:0 auto;padding:22px 16px 70px}
  h1{font-family:'Inter Tight',Arial,sans-serif;font-size:24px;font-weight:700;margin:0}
  a{color:var(--blue)}
  .sub{color:var(--faint);font-size:13.5px;margin:4px 0 0}
  .gate{background:var(--bg);border:1px solid var(--hair);border-radius:10px;padding:14px 16px;margin:16px 0}

  .states{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}
  .sbtn{background:var(--bg);border:1px solid var(--hair);border-radius:99px;
        padding:6px 13px;font-size:13px;cursor:pointer;color:var(--ink2);font-weight:600}
  .sbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .sbtn i{font-style:normal;font-weight:400;opacity:.75;margin-left:5px;font-variant-numeric:tabular-nums}

  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
  .bar input{border:1px solid var(--hair);border-radius:8px;padding:7px 11px;font-size:13.5px;min-width:220px;font-family:inherit}
  .note{background:#fff8e6;border:1px solid #f0e2bd;border-radius:10px;padding:10px 13px;font-size:13px;color:#6a5520;margin:0 0 14px}

  .tw{background:var(--bg);border:1px solid var(--hair);border-radius:12px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--hair2);white-space:nowrap}
  th{position:sticky;top:0;background:var(--bg);font-size:11.5px;color:var(--faint);
     font-weight:600;cursor:pointer;user-select:none;z-index:1}
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
  th .ar{opacity:.5;font-size:10px}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--wash)}
  td.who{white-space:normal;min-width:220px}
  td.who b{font-weight:600}
  td.who span{display:block;color:var(--faint);font-size:12px}
  td.why{white-space:normal;max-width:300px;color:var(--ink2);font-size:12.5px}
  td.act{white-space:normal;max-width:210px}
  td.act b{font-weight:600;display:block}
  td.act span{color:var(--faint);font-size:12px}
  .sc{font-weight:700;font-variant-numeric:tabular-nums}

  .pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px}
  .p-customer{background:var(--violet-w);color:var(--violet)}
  .p-hot{background:var(--red-w);color:var(--red)}
  .p-engaged{background:var(--green-w);color:var(--green)}
  .p-cooling{background:var(--amber-w);color:var(--amber)}
  .p-dormant{background:var(--grey-w);color:var(--grey)}
  .p-lost{background:var(--grey-w);color:var(--grey);opacity:.75}
  .p-new{background:#eef3fd;color:var(--blue)}
  .mut{color:var(--faint)}
  footer{margin-top:16px;color:var(--faint);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Contacts</h1>
  <p class="sub">Every signed-up person, with a lifecycle state, a lead score, the
     evidence behind that score, and the action worth taking next. Click a row for
     the full timeline.</p>

  <div class="gate" id="gate">Loading...</div>
  <div id="app" hidden>
    <div class="note" id="caveat"></div>
    <div class="states" id="states"></div>
    <div class="bar">
      <input id="q" type="search" placeholder="Search email or name" autocomplete="off">
      <span class="mut" id="count"></span>
    </div>
    <div class="tw">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <footer id="foot"></footer>
  </div>
</div>

<script>
(function(){
  function $(id){return document.getElementById(id);}
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function n(v){return (v==null?0:v).toLocaleString('en-US');}
  function ago(sec){
    if(!sec) return '-';
    var d=Math.floor(Date.now()/1000)-sec;
    if(d<3600) return Math.max(1,Math.floor(d/60))+'m';
    if(d<86400) return Math.floor(d/3600)+'h';
    return Math.floor(d/86400)+'d';
  }
  // Same token read as /admin/user.html, so one sign-in serves every admin page.
  function token(){
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(/^sb-.*-auth-token$/.test(k)){
          var v=JSON.parse(localStorage.getItem(k));
          return (Array.isArray(v)?v[0]:(v&&v.access_token))||null;
        }
      }
    }catch(e){}
    return null;
  }

  var tok=token(), gate=$('gate'), app=$('app');
  if(!tok){
    gate.innerHTML='Sign in first, then reload. <a href="/signin.html?next='+
      encodeURIComponent('/admin/contacts.html')+'">Sign in</a>';
    return;
  }

  var COLS=[
    {k:'who',  t:'Person',        sort:null},
    {k:'state',t:'State',         sort:null},
    {k:'score',t:'Score',         sort:'score', num:true},
    {k:'why',  t:'Why',           sort:null},
    {k:'action',t:'Next action',  sort:null},
    {k:'last_seen',t:'Last seen', sort:'last_seen', num:true},
    {k:'lessons',t:'Lessons',     sort:'lessons', num:true},
    {k:'solved',t:'Solved',       sort:'solved', num:true},
    {k:'xp',   t:'XP',            sort:'xp', num:true},
    {k:'wall', t:'Wall hits',     sort:'wall', num:true},
    {k:'pricing',t:'Pricing',     sort:'pricing', num:true},
    {k:'checkout',t:'Checkout',   sort:'checkout', num:true},
    {k:'opens',t:'Opens',         sort:'opens', num:true},
    {k:'created',t:'Joined',      sort:'created', num:true}
  ];
  var STATES=['','customer','hot','engaged','cooling','dormant','new','lost'];
  var LABEL={'':'All','customer':'Customers','hot':'Hot','engaged':'Engaged',
             'cooling':'Cooling','dormant':'Dormant','new':'New','lost':'Lost'};

  var st={sort:'score', dir:'desc', state:'', q:''}, timer=null;

  function load(){
    var qs='?sort='+st.sort+'&dir='+st.dir+'&limit=500'+
           (st.state?'&state='+st.state:'')+(st.q?'&q='+encodeURIComponent(st.q):'');
    fetch('/api/admin/contacts'+qs,{headers:{Authorization:'Bearer '+tok}})
      .then(function(r){
        if(r.status===401||r.status===403) throw new Error('restricted');
        if(!r.ok) throw new Error('HTTP '+r.status);
        return r.json();
      })
      .then(render)
      .catch(function(e){
        gate.hidden=false; app.hidden=true;
        gate.textContent = e.message==='restricted'
          ? 'This page is restricted to the admin account.'
          : 'Failed to load ('+e.message+').';
      });
  }

  function render(d){
    gate.hidden=true; app.hidden=false;

    // State of the data, said plainly rather than implied.
    $('caveat').innerHTML =
      '<b>'+n(d.caveat.purchases)+' purchases in the whole database.</b> '+
      esc(d.caveat.note)+' Not scored: '+esc(d.caveat.excluded)+'.';

    $('states').innerHTML = STATES.map(function(s){
      var c = s? (d.counts[s]||0) : d.total;
      return '<button class="sbtn'+(st.state===s?' on':'')+'" data-s="'+s+'">'+
             LABEL[s]+'<i>'+n(c)+'</i></button>';
    }).join('');

    $('count').textContent = n(d.matched)+' of '+n(d.total)+' shown';

    $('head').innerHTML = COLS.map(function(c){
      var on = c.sort && c.sort===st.sort;
      return '<th'+(c.num?' class="num"':'')+(c.sort?' data-k="'+c.sort+'"':'')+'>'+
             c.t+(on?' <span class="ar">'+(st.dir==='desc'?'▼':'▲')+'</span>':'')+'</th>';
    }).join('');

    $('rows').innerHTML = d.rows.map(function(r){
      var url='/admin/user.html?email='+encodeURIComponent(r.email);
      return '<tr>'+
        '<td class="who"><b><a href="'+url+'">'+esc(r.name||r.email)+'</a></b>'+
          '<span>'+esc(r.email)+(r.signup_gate?' &middot; via '+esc(r.signup_gate):'')+'</span></td>'+
        '<td><span class="pill p-'+r.state+'">'+r.state+'</span></td>'+
        '<td class="num sc">'+n(r.score)+'</td>'+
        '<td class="why">'+(r.why.length?esc(r.why.join(', ')):'<span class="mut">no signals yet</span>')+'</td>'+
        '<td class="act"><b>'+esc(r.action)+'</b><span>'+esc(r.action_why)+'</span></td>'+
        '<td class="num">'+ago(r.last_seen)+'</td>'+
        '<td class="num">'+n(r.lessons)+'</td>'+
        '<td class="num">'+n(r.solved)+'</td>'+
        '<td class="num">'+n(r.xp)+'</td>'+
        '<td class="num">'+(r.wall?n(r.wall):'<span class="mut">0</span>')+'</td>'+
        '<td class="num">'+(r.pricing?n(r.pricing):'<span class="mut">0</span>')+'</td>'+
        '<td class="num">'+(r.checkout?'<b>'+n(r.checkout)+'</b>':'<span class="mut">0</span>')+'</td>'+
        '<td class="num">'+n(r.opens)+'</td>'+
        '<td class="num">'+ago(r.created_at)+'</td>'+
        '</tr>';
    }).join('') || '<tr><td colspan="14" class="mut">Nobody matches that.</td></tr>';

    $('foot').textContent =
      'Score orders the list, it does not predict. Every figure is derived live '+
      'from the activity tables; nothing here is stored.';
  }

  $('states').addEventListener('click', function(e){
    var b=e.target.closest('.sbtn'); if(!b) return;
    st.state=b.getAttribute('data-s'); load();
  });
  $('head').addEventListener('click', function(e){
    var th=e.target.closest('th[data-k]'); if(!th) return;
    var k=th.getAttribute('data-k');
    if(st.sort===k) st.dir = st.dir==='desc' ? 'asc' : 'desc';
    else { st.sort=k; st.dir='desc'; }
    load();
  });
  $('q').addEventListener('input', function(){
    clearTimeout(timer);
    timer=setTimeout(function(){ st.q=$('q').value.trim(); load(); }, 250);
  });

  load();
})();
</script>
</body>
</html>
