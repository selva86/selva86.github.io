<script defer src="/www/auth-hydrate.js?v=13"></script>
<script>
/* Soft poll: if /api/me flips to pro while the user is on this page, confirm
   it. The webhook is the source of truth for provisioning; this is UX only. */
(function () {
  "use strict";
  function readToken() {
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k || k.indexOf("sb-") !== 0 || k.indexOf("-auth-token") < 0) continue;
        var raw = localStorage.getItem(k); if (!raw) continue;
        var val = raw;
        if (raw.charAt(0) !== "{" && raw.indexOf("base64-") === 0) { try { val = atob(raw.slice(7)); } catch (e) {} }
        try { var o = JSON.parse(val); if (o && o.access_token) return o.access_token; if (Array.isArray(o) && typeof o[0] === "string") return o[0]; }
        catch (e) { if (val.split(".").length === 3) return val; }
      }
    } catch (e) {}
    return null;
  }
  var tok = readToken();
  if (!tok) return;
  var tries = 0;
  function check() {
    if (tries++ > 18) return; // ~90s then stop quietly
    fetch("/api/me", { headers: { Authorization: "Bearer " + tok } })
      .then(function (r) { return r.json(); })
      .then(function (me) {
        if (me && me.pro) {
          document.getElementById("wc-title").textContent = "You are Pro now";
          document.getElementById("wc-copy").textContent = "Everything is unlocked: every course, graded practice with solutions, and certificates. Pick up where you left off.";
        } else { setTimeout(check, 5000); }
      })
      .catch(function () { setTimeout(check, 5000); });
  }
  setTimeout(check, 2500);
})();
</script>
