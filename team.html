<style>
.auth-anon{display:none;align-items:center}body.state-anon .auth-anon{display:inline-flex}
.masthead-auth-link{font-size:14px;font-weight:600;color:var(--ink);border-bottom:2px solid var(--line);padding-bottom:1px}.masthead-auth-link:hover{border-color:var(--ink)}
/* seat meter */
.tm-seatbar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.tm-seatfill{height:100%;background:linear-gradient(90deg,#2f6df6,#6aa0ff);border-radius:6px;transition:width .25s ease}
.tm-seatnums{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.tm-seatnums b{color:var(--ink);font-weight:600}
.tm-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.tm-row:first-of-type{border-top:0}
.tm-av{width:30px;height:30px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--muted);flex:none}
.tm-who{min-width:0;flex:1}
.tm-who .em{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-who .rl{font-size:12px;color:var(--muted)}
.tm-pill{font-size:11px;font-weight:600;letter-spacing:.02em;padding:3px 8px;border-radius:999px;background:var(--line);color:var(--muted);flex:none}
.tm-pill.owner{background:#eef3ff;color:#2f6df6}
.tm-pill.pending{background:#fff5e6;color:#b7791f}
.tm-x{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;font-size:12.5px;padding:5px 10px;cursor:pointer;flex:none}
.tm-x:hover{border-color:#e06b6b;color:#c0392b}
.tm-invite{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tm-invite input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px}
.tm-invite input:focus{outline:none;border-color:#2f6df6}
.tm-sub{font-size:13px;color:var(--muted);margin:2px 0 0}
.tm-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 4px}
.tm-h h2{font-family:'Inter Tight';font-size:17px;font-weight:600;margin:0}
.tm-msg{font-size:13px;margin-top:8px;min-height:16px}
.tm-msg.ok{color:#1f9d55}.tm-msg.err{color:#c0392b}
.tm-note{font-size:12.5px;color:var(--muted);margin-top:10px}
</style>
</head>
