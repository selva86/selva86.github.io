<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accept your team invite &middot; r-statistics.co</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/screenshots/iconb-64.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/www/dashboard.css?v=4">
<link rel="stylesheet" href="/www/account.css?v=1">
<style>
.tiwrap{max-width:520px;margin:8vh auto;padding:0 20px}
.ticard{background:var(--card,#fff);border:1px solid var(--line);border-radius:16px;padding:32px 30px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tibadge{width:52px;height:52px;border-radius:14px;background:#eef3ff;color:#2f6df6;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.ticard h1{font-family:'Inter Tight';font-size:22px;font-weight:700;margin:0 0 8px;color:var(--ink)}
.ticard p{color:var(--muted);font-size:15px;margin:0 0 18px;line-height:1.5}
.ticard .primary,.ticard .ghost{display:inline-block}
.ti-spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:#2f6df6;border-radius:50%;animation:tispin .8s linear infinite;margin:6px auto}
@keyframes tispin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<nav class="nav"><div class="wrap"><a class="brand" href="/"><span class="brand-mark">R</span>r-statistics<span class="co">.co</span></a></div></nav>
<div class="tiwrap"><div class="ticard" id="ti-card">
<div class="tibadge"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13A4 4 0 0 1 16 11"/></svg></div>
<div class="ti-spin"></div>
<p>Checking your invite…</p>
</div></div>
<script defer src="/www/auth-hydrate.js?v=13"></script>
<script>
(function () {
  "use strict";
  var card = document.getElementById("ti-card");
  var params = new URLSearchParams(location.search);
  var token = params.get("token") || "";
  var selfUrl = "/team-invite.html?token=" + encodeURIComponent(token);

  function readToken() {
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k || k.indexOf("sb-") !== 0 || k.indexOf("-auth-token") < 0) continue;
        var raw = localStorage.getItem(k); if (!raw) continue;
        var val = raw;
        if (raw.charAt(0) !== "{" && raw.indexOf("base64-") === 0) { try { val = atob(raw.slice(7)); } catch (e) {} }
        try { var o = JSON.parse(val); if (o && o.access_token) return o.access_token; if (Array.isArray(o) && typeof o[0] === "string") return o[0]; }
        catch (e) { if (val.split(".").length === 3) return val; }
      }
    } catch (e) {}
    return null;
  }
  function view(html) { card.innerHTML = html; }
  function badge() {
    return '<div class="tibadge"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13A4 4 0 0 1 16 11"/></svg></div>';
  }

  if (!token) {
    view(badge() + "<h1>Invite link is incomplete</h1><p>This link is missing its token. Ask your team to resend the invite.</p>");
    return;
  }

  var TOKEN = readToken();
  if (!TOKEN) {
    view(badge() + "<h1>You are invited to a team</h1><p>Sign in (or create a free account) with the email your invite was sent to, and your seat is applied automatically.</p>" +
      '<a class="primary" href="/signin.html?next=' + encodeURIComponent(selfUrl) + '">Sign in to accept</a>');
    return;
  }

  fetch("/api/teams/invites/accept", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + TOKEN },
    body: JSON.stringify({ token: token }),
  }).then(function (r) {
    return r.json().catch(function () { return null; }).then(function (j) { return { status: r.status, json: j }; });
  }).then(function (r) {
    if (r.status === 200 && r.json && r.json.ok) {
      var name = (r.json.org && r.json.org.name) || "your team";
      view(badge() + "<h1>You are in!</h1><p>Your seat on <strong>" + escapeHtml(name) + "</strong> is active. You now have All-Access Pro: every course, graded practice, and certificates.</p>" +
        '<a class="primary" href="/dashboard.html">Go to your dashboard</a>');
    } else if (r.status === 401) {
      view(badge() + "<h1>Please sign in</h1><p>Sign in with the invited email to accept your seat.</p>" +
        '<a class="primary" href="/signin.html?next=' + encodeURIComponent(selfUrl) + '">Sign in</a>');
    } else {
      var m = (r.json && r.json.error && r.json.error.message) || "This invite could not be accepted.";
      view(badge() + "<h1>Could not accept invite</h1><p>" + escapeHtml(m) + "</p>" +
        '<a class="ghost" href="/">Back to r-statistics.co</a>');
    }
  }).catch(function () {
    view(badge() + "<h1>Something went wrong</h1><p>Please refresh and try again.</p>");
  });

  function escapeHtml(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
})();
</script>
</body>
</html>
