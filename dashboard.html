<main class="wrap">

  <!-- ============ the rail: who you are and what you have done ============ -->
  <aside class="rail rise" id="dh-rail">
    <div class="who">
      <span class="pic" id="dh-pic">&nbsp;</span>
      <span><b id="dh-name" class="dh-skel">&nbsp;</b><small id="dh-since"></small></span>
    </div>

    <div class="sec" id="dh-streak-sec" hidden>
      <div class="flame">
        <span class="big" id="dh-streakbig">0</span>
        <span class="cap" id="dh-streakcap"></span>
      </div>
      <div class="days" id="dh-days"></div>
    </div>

    <div class="sec" id="dh-rec-sec" hidden>
      <h4>Your record</h4>
      <div class="figs" id="dh-figs"></div>
      <div class="qbar" id="dh-qbar" hidden></div>
      <p class="qkey" id="dh-qkey" hidden></p>
    </div>

    <div class="sec" id="dh-miles-sec" hidden>
      <h4 id="dh-miles-h">Milestones</h4>
      <div class="nextgem" id="dh-miles-next" hidden></div>
      <div class="gems" id="dh-miles"></div>
      <p class="more" id="dh-miles-more" hidden></p>
    </div>

    <div class="sec" id="dh-badges-sec" hidden>
      <h4 id="dh-badges-h">Badges</h4>
      <div class="coins" id="dh-badges"></div>
    </div>

    <div class="sec" id="dh-cred-sec" hidden>
      <h4>Credentials</h4>
      <div id="dh-certs"></div>
      <div id="dh-credprog"></div>
    </div>

    <div class="sec railfoot" id="dh-railfoot" hidden></div>
  </aside>

  <!-- ============ the work ============ -->
  <div class="work">
    <div id="dh-optin"></div>

    <div class="greet rise">
      <h1 id="dh-h1">Welcome back.</h1>
      <p id="dh-sub" class="dh-skel">Loading your dashboard...</p>
    </div>

    <section class="act rise" id="dh-act" hidden>
      <span class="rule" aria-hidden="true"></span>
      <div class="k" id="dh-act-k"></div>
      <h2 id="dh-act-h"></h2>
      <p id="dh-act-p"></p>
      <div class="pb" id="dh-act-pb" hidden><i id="dh-act-bar" style="width:0%"></i></div>
      <div class="actrow">
        <a class="go" id="dh-act-btn" href="#"></a>
        <span class="aft" id="dh-act-aft"></span>
      </div>
      <div class="then" id="dh-act-then" hidden></div>
    </section>

    <div class="block rise" id="dh-flight-sec" hidden>
      <div class="reg"><h3>In flight</h3><span id="dh-flight-aside"></span></div>
      <div id="dh-flight"></div>
      <div class="foot" id="dh-flight-foot" hidden></div>
      <p class="sell" id="dh-sell" hidden></p>
    </div>

    <div class="block rise" id="dh-year-sec" hidden>
      <div class="reg"><h3>A year of practice</h3><span id="dh-year-aside"></span></div>
      <div class="year" id="dh-year"></div>
      <p class="note" id="dh-year-note"></p>
    </div>
  </div>

</main>
